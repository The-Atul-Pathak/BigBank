{% extends "base.html" %}
{% block title %}Open account{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Open a new account</h1>
  <form method="post" class="card">
    <label>Account type
      <select name="account_type_id">
        {% for t in account_types %}
          <option value="{{ t.account_type_id }}">
            {{ t.name }}: {{ t.interest_rate }}% interest, min balance {{ t.min_balance | money }},
            max daily limit {{ t.max_daily_limit | money }}
          </option>
        {% endfor %}
      </select>
    </label>
    <label>Branch
      <select name="branch_id">
        {% for b in branches %}<option value="{{ b.branch_id }}">{{ b.name }} ({{ b.ifsc }})</option>{% endfor %}
      </select>
    </label>
    <label>Daily limit (cannot be more than the type's max)
      <input type="number" name="daily_limit" min="1" step="0.01" value="50000" required>
    </label>
    <label>Monthly spending budget (optional)
      <input type="number" name="spending_budget" min="0" step="0.01">
    </label>
    <button>Open account</button>
  </form>
  <p class="muted">Your KYC must be approved first. The database checks this with a trigger.</p>
</div>
{% endblock %}
