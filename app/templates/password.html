{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Change password</h1>
  <form method="post" class="card">
    <label>Current password <input type="password" name="current" required autofocus></label>
    <label>New password <input type="password" name="new" required minlength="6"></label>
    <label>New password again <input type="password" name="confirm" required minlength="6"></label>
    <button>Change password</button>
  </form>
</div>
{% endblock %}
